name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Let other versions finish even if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12"] # Add versions you support

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip" # Caches dependencies to speed up runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs your package + test dependencies (see pyproject.toml section below)
          pip install -e ".[test]" 

      - name: Run Pytest
        # Runs tests and outputs a coverage report to the terminal
        run: pytest
