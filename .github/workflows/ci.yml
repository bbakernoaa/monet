---
name: CI

"on":
  push:
    branches: [stable, master, develop, 'v3']
  pull_request:
    branches: [stable, master, develop, 'v3', 'feature/**']

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Removed the strict repository check to allow testing on your fork
    strategy:
      fail-fast: false
      matrix:
        # 3.9 dropped for monet-stats compatibility; 3.13 not yet supported
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash -l {0}  # Necessary for micromamba to activate environments

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python (micromamba)
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment-dev.yml
          environment-name: monet-env
          cache-environment: true
          # We force the python version from the matrix into the env
          create-args: python=${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Run Tests
        run: pytest -v --cov=monet

  wheel-smoke:
    name: Wheel smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment-dev.yml
          environment-name: monet-wheel
          cache-environment: true
          create-args: python=${{ matrix.python-version }}
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps . \
            --wheel-dir "$RUNNER_TEMP/monet-wheels"
          python -m pip install --no-deps \
            "$RUNNER_TEMP"/monet-wheels/monet-*.whl
      - name: Verify installed package and data outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python -c 'import monet; print(monet.__file__)'
          python -c 'from pathlib import Path; \
            from monet.util.mask import NCEP_POLY_DIR; \
            assert Path(NCEP_POLY_DIR, "APL.poly").is_file()'

  docs:
    name: Check docs build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python (micromamba)
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: docs/environment-docs.yml
          environment-name: monet-docs
          cache-environment: true

      - name: Build Docs
        run: mkdocs build
