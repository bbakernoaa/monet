name: monet-docs
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - ipykernel
  - ipython
  #
  # core
  - cartopy
  - dask
  - matplotlib
  - netcdf4
  - numpy
  - pandas>=1.0
  - pydecorate
  - seaborn
  - xarray
  - esmpy
  - mpi4py
  #
  # optional
  - pyresample
  #
  # docs
  - mkdocs
  - mkdocs-material
  - mkdocstrings-python
  - mkdocs-gallery
  #
  - pip>=21.1
  - pip:
      - "-e ../"
