name: monet-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.11
  - cartopy
  - dask
  - distributed
  - matplotlib
  - h5py
  - netcdf4
  - numpy
  - pandas
  - pillow>=9.1.0
  - pip
  - seaborn
  - xarray
  - pytest
  - pytest-cov
  - pooch
  # AXIS Python builds require a C++20 compiler, CMake, Kokkos and KokkosKernels.
  - cmake>=3.21
  - kokkos>=5.1
  - kokkos-kernels>=5.1
  - scipy
  - pip:
      - "axis-regrid @ git+https://github.com/bbakernoaa/HELM.git@c5a38a8ca14ba7afa190eceebb62495323957b21#subdirectory=libs/axis"
      - "pytspack @ git+https://github.com/noaa-oar-arl/pytspack.git@306ca0771c4adc15ce346d99d8d178c38a464209"
      - "monet-stats @ git+https://github.com/noaa-oar-arl/monet-stats.git@0b3aeb4fb72e1e1a29b8888ebd57c07eef227ab9"
